name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: myschedule_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/myschedule_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-only-secret-key-that-is-long-enough-123456
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest
      - name: Migrations apply to an empty database
        run: |
          createdb -h localhost -U postgres myschedule_migrations
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/myschedule_migrations \
            flask --app app.py db upgrade -d migrations
        env:
          PGPASSWORD: postgres
      - name: Tests
        run: python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/myschedule_test
          TEST_REDIS_URL: redis://localhost:6379/15

  web:
    name: Web lint, types and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/myschedule-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/myschedule-web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx eslint .
      - run: npx next typegen && npx tsc --noEmit
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: frontend/myschedule-web
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Compose file is valid
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci/; s/^JWT_SECRET_KEY=$/JWT_SECRET_KEY=ci-only-secret-key-that-is-long-enough-123456/' .env
          docker compose config -q
